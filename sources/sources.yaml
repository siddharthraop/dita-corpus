# Real inconsistencies on the live pages, kept in the corpus on purpose.
# MANIFEST, AlignR and VALID use them as test cases. Do not "fix" them in the source;
# each project must detect them.
known_issues:
  - id: KI-1
    summary: "v6e HBM capacity unit differs between pages"
    detail: "The v6e page gives HBM capacity per chip as 32 GB. The TPU7x comparison table gives v6e as 32 in a GiB column."
    sources: [tpu-v6e, tpu7x]
    where: [tpu/topics/tpu-v6e-specifications.dita, tpu/topics/tpu-generations-compared.dita]
  - id: KI-2
    summary: "TPU7x HBM bandwidth: table and prose disagree"
    detail: "The specification table gives 7380 GBps (7.38 TB/s). The memory hierarchy prose says approximately 7.37 TB/s."
    sources: [tpu7x]
    where: [tpu/topics/tpu7x-specifications.dita, tpu/topics/tpu7x-memory.dita]
  - id: KI-3
    summary: "v5e HBM bandwidth unit"
    detail: "The v5e page gives HBM bandwidth as 800 GiBps; every other generation uses GBps."
    sources: [tpu-v5e]
    where: [tpu/topics/tpu-v5e-specifications.dita]
  - id: KI-4
    summary: "Relationship table keeps platform-filtered topics published"
    detail: "Each generation's branch in tpu.ditamap is scoped with @platform, but the reltable references the same topics with no condition. DITA-OT 4.4 therefore still publishes the other generations' pages in a filtered build (it only drops them from the table of contents). Found by MANIFEST's restore step, which matches DITA-OT and reports it."
    sources: []
    where: [tpu/tpu.ditamap]
  - id: KI-0-retired
    summary: "TPU7x HBM capacity 192 GiB vs 192 GB (retired)"
    detail: "Cited in earlier design documents. On 2026-10-24 the live page states 192 GiB in both the table and the prose, so the corpus no longer reproduces it."
    sources: [tpu7x]
